<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: beige;
            border: 5px solid black;
            margin: 2px;
            padding:2px;
            display:flex;
            flex-direction: row;
            /* flex-direction: row-reverse; */
            /* flex-wrap: wrap; */
            height: 300px;
            /* justify-content: space-around; */
            align-items: start;
            align-content: center;
            
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 10px;
        }
        #box1{
            background-color: aqua;
            order:500;
            flex-grow: 1;
            flex-shrink: 1;
            align-self: center;
        }
        #box2{
            background-color: blue;
            order:100;
            flex-grow: 1;
            flex-shrink: 1;
            align-self: start;
        }
        #box3{
            background-color: orange;
            order:200;
            flex-grow: 1;
            flex-shrink: 1;
            align-self: end;
        }        
        #box4{
            background-color: brown;
            order:300;
            flex-grow: 1;
            flex-shrink: 1;
            align-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">Box 1</div>
        <div class="box" id="box2">Box 2</div>
        <div class="box" id="box3">Box 3</div>
        <div class="box" id="box4">Box 4</div>
    </div>
    
</body>
</html>
