<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid rgb(0, 0, 0);
            height: 2000px;
        }
        img{
            margin: 10px;
        }
        .image1{
            /* allows the element to be positioned relative to the nearest positioned ancestor */
            position: absolute;
            top : 100px;
        }
        .image2{
            /* allows the element to be positioned relative to its normal position */
            position: relative;
            left:100px;
        }
        .image3{
            /* allows the element to be positioned relative to the viewport */
            position: fixed;
            top: 100px;
            left: 100px;
        }
        .image4{
            /* allows the element to be positioned relative to the nearest positioned ancestor */
            position: sticky;
            top: 100px;
        }
        .box{
            background-color: red;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class = "container">
        <img src="images.jpg" alt="poster 1" width="200px" height="200px" class ="image1">
        <img src="images.jpg" alt="poster 2" width="200px" height="200px" class ="image2">
        <img src="images.jpg" alt="poster 3" width="200px" height="200px" class ="image3">
        <img src="images.jpg" alt="poster 4" width="200px" height="200px" class ="image4">
    </div>
    <div>
        <div class="box">

        </div>
    </div>
</body>
</html>
