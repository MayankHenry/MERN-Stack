<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 5px solid black;
            background-color: beige;
            display: flex;
            flex-direction: row;
            width: 300px;
        }
        #boxleft{
            background-color: aqua;
            border: 1px solid blue;
            width:47%;
            margin:3px;
            padding:3px;
            display:flex;

        }
        #boxright{
            background-color: orange;
            border: 1px solid red;
            width:47%;
            margin:3px;
            padding:3px;
        }
        p{
            border: 1px solid rgb(255, 5, 5);
        }
        img{
            width: 100px;
            height: 100px;
        }
        @media (max-width: 640px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div id="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>
        
        <div id="boxright">
            <img src="images.jpg" alt="Description of the image">
        </div>
    </div>
</body>
</html>
