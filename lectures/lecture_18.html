<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid rgb(0, 0, 0);
            width: 25%;
        }
        .parent{
            border: 1px solid rgb(0, 0, 0);
            background-color: red;
            width: 50%;
        }
        .child{
            border: 1px solid rgb(0, 0, 0);
            background-color: blue;
            width: 20%;
        }
        .container{
            border: 1px solid rgb(0, 0, 0);
            background-color: green;
            width: 75%;
        }
        .box1{
            border: 1px solid rgb(0, 0, 0);
            width: 100%;
            font-size: 100px;
        }
        .wrapper{
            font-size: 50px;
        }
        .px{
            font-size: 50px;
        }
        .vw{
            font-size: 10vw;
        }   
    .em{
            font-size: 5em;
        }
        .rem{
            font-size: 5rem;
        }
        p{
            border: 1px solid rgb(0, 0, 0);
            font-size: 5rem;
        }
    </style>
</head>
<body>
    <div class ="box">Welcome to mayank</div>
    <div>
        <div class="parent">
            <div class="child">Child Content</div>
        </div>
    </div>

    <div>
        <div class="container">Container Content</div>
    </div>
    <div>
        <div class="box1">Box1 Content</div>
    </div>

    <div class="wrapper">
        <div class="px">PX Content</div>
        <div class="vw">VW Content</div>
        <div class="em">EM Content</div>
        <div class="rem">REM Content</div>
    </div>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur, dolore? Nostrum incidunt expedita iste, architecto voluptates dolorum quae. Aperiam, placeat.</p>
</body>
</html>
